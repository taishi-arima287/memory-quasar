services:
  db:
    image: postgres:17
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=dbname
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d dbname']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - memory-quasar-network

  api:
    build:
      # shared/ とルートの package-lock.json が必要なため、コンテキストはルート
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '8080:8080'
    volumes:
      - ./apps/api:/repo/apps/api
      - /repo/apps/api/node_modules
      - /repo/apps/api/dist
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - PORT=8080
      - DATABASE_URL=postgresql://user:password@db:5432/dbname?schema=public
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret}
      - JWT_EXPIRES_IN=1d
    networks:
      - memory-quasar-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '3000:3000'
    environment:
      - INTERNAL_API_URL=http://api:8080
    volumes:
      - ./apps/web:/repo/apps/web
      - ./shared:/repo/shared
      # ホスト（macOS）の node_modules / .next で上書きされないように隠す
      - /repo/apps/web/node_modules
      - /repo/apps/web/.next
      - /repo/shared/node_modules
    depends_on:
      - api
    networks:
      - memory-quasar-network

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    ports:
      - '8000:8000'
    environment:
      - INTERNAL_API_URL=http://api:8080
    volumes:
      - ./apps/admin:/repo/apps/admin
      - ./shared:/repo/shared
      # ホスト（macOS）の node_modules / .next で上書きされないように隠す
      - /repo/apps/admin/node_modules
      - /repo/apps/admin/.next
      - /repo/shared/node_modules
    depends_on:
      - api
    networks:
      - memory-quasar-network

networks:
  memory-quasar-network:
    driver: bridge

volumes:
  postgres_data:
